before_script:
  - cp spec/dummy/config/database.peak_flow.yml spec/dummy/config/database.yml
  - cd spec/dummy && bundle exec rails db:create db:environment:set db:schema:load
rvm: true
services:
  postgres:
    environment:
      POSTGRES_USER: "build"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "active_record_query_fixer_test"
    expose:
      - 5432
    image: postgres:11.4
builds:
  build_1:
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_2_rails_6.gemfile
      RUBY_VERSION: 2.7.8
    name: Ruby 2.7.8, Rails 6
    paths:
      - ".rspec"
      - ".ruby-version"
      - "Appraisals"
      - "active_record_query_fixer.gemspec"
      - "lib/**"
      - "spec/**"
      - "!spec/dummy/log/**"
      - "gemfiles/ruby_2_rails_6.gemfile"
      - "gemfiles/ruby_2_rails_6.gemfile.lock"
    script:
      - bundle exec appraisal "ruby 2 rails 6" rspec
  build_2:
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_2_rails_7.gemfile
      RUBY_VERSION: 2.7.8
    name: Ruby 2.7.8, Rails 7
    paths:
      - ".rspec"
      - ".ruby-version"
      - "Appraisals"
      - "active_record_query_fixer.gemspec"
      - "lib/**"
      - "spec/**"
      - "!spec/dummy/log/**"
      - "gemfiles/ruby_2_rails_7.gemfile"
      - "gemfiles/ruby_2_rails_7.gemfile.lock"
    script:
      - bundle exec appraisal "ruby 2 rails 7" rspec
  build_3:
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_3_rails_6.gemfile
      RUBY_VERSION: 3.2.2
    name: Ruby 3.2.2, Rails 6
    paths:
      - ".rspec"
      - ".ruby-version"
      - "Appraisals"
      - "active_record_query_fixer.gemspec"
      - "lib/**"
      - "spec/**"
      - "!spec/dummy/log/**"
      - "gemfiles/ruby_3_rails_6.gemfile"
      - "gemfiles/ruby_3_rails_6.gemfile.lock"
    script:
      - bundle exec appraisal "ruby 3 rails 6" rspec
  build_4:
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_3_rails_7.gemfile
      RUBY_VERSION: 3.2.2
    name: Ruby 3.2.2, Rails 7
    paths:
      - ".rspec"
      - ".ruby-version"
      - "Appraisals"
      - "active_record_query_fixer.gemspec"
      - "lib/**"
      - "spec/**"
      - "!spec/dummy/log/**"
      - "gemfiles/ruby_3_rails_7.gemfile"
      - "gemfiles/ruby_3_rails_7.gemfile.lock"
    script:
      - bundle exec appraisal "ruby 3 rails 7" rspec
  build_5:
    name: Linters
    paths:
      - ".rubocop.yml"
      - ".rubocop_todo.yml"
      - ".ruby-version"
      - "Gemfile"
      - "Gemfile.lock"
      - "Rakefile"
      - "active_record_query_fixer.gemspec"
      - "bin/**"
      - "lib/**"
      # RuboCop excludes the generated schema from inspection, the rspec builds still load it.
      - "spec/**"
      - "!spec/dummy/db/schema.rb"
      - "!spec/dummy/log/**"
    script:
      - bundle exec rake best_practice_project:run
